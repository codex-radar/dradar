[project]
name = "dradar"
version = "0.5.187"
description = "Crowd Radar client — run benchmark tasks locally and submit them for independent server-side grading"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.2.2",
    "cryptography>=45",
    "httpx[socks]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "datacurve-pier==0.3.0; python_version >= '3.12'",
]

[project.scripts]
dradar = "dradar.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dradar"]
