name: Pier redirected output encoding
on:
  pull_request:
    paths:
      - 'src/dradar/runner.py'
      - 'tests/test_pier_output_encoding.py'
      - '.github/workflows/test-pier-output.yml'
permissions:
  contents: read
jobs:
  output-encoding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - run: python -m pytest -q tests/test_pier_output_encoding.py
