name: Publish reviewed fixed wheel to existing R2
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Same-repository Actions artifact containing the exact reviewed 0.5.290 wheel
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: dradar-cli-ota-production
  cancel-in-progress: false
env:
  PYTHONPATH: src
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ota-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.9.7
          enable-cache: false
      - name: Prepare locked environment and reviewed artifact
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          uv venv .release-venv --python 3.13
          uv pip install --python .release-venv/bin/python --require-hashes -r release/ota/requirements.lock
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > "${RUNNER_TEMP}/artifact.json"
          python3 -c 'import json,os,sys; d=json.load(open(sys.argv[1])); assert not d["expired"]; assert d["name"] == "dradar-cli-0.5.290-7e237a52c13581ee"; assert d["workflow_run"]["head_sha"] == os.environ["GITHUB_SHA"]; assert d["workflow_run"]["head_branch"] == "main"' "${RUNNER_TEMP}/artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "${RUNNER_TEMP}/artifact.zip"
          mkdir fixed-wheel
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'artifact.zip') as archive:
              files = [i for i in archive.infolist() if not i.is_dir()]
              assert len(files) == 1
              item = files[0]
              assert '/' not in item.filename and '\\' not in item.filename
              assert item.filename.startswith('dradar-') and item.filename.endswith('.whl')
              assert item.file_size == 903099
              Path('fixed-wheel', item.filename).write_bytes(archive.read(item))
          PY
      - name: Verify existing immutable bucket policy
        env:
          DRADAR_OTA_CLOUDFLARE_API_TOKEN: ${{ secrets.DRADAR_OTA_CLOUDFLARE_API_TOKEN }}
        run: |
          .release-venv/bin/python scripts/ota_release.py cloudflare-preflight --account-id 4d94f3bcb89bc16989d5ea715eaac061 --bucket dradar-cli-ota-production --public-base-url https://updates.codexradar.com
      - name: Conditional publish and direct HTTP verification
        env:
          DRADAR_OTA_R2_ACCESS_KEY_ID: ${{ secrets.DRADAR_OTA_R2_ACCESS_KEY_ID }}
          DRADAR_OTA_R2_SECRET_ACCESS_KEY: ${{ secrets.DRADAR_OTA_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          .release-venv/bin/python scripts/publish_fixed_wheel.py --wheel fixed-wheel/*.whl --receipt fixed-wheel/DOWNLOAD_RECEIPT.json --source-commit "${GITHUB_SHA}"
          cat fixed-wheel/DOWNLOAD_RECEIPT.json
