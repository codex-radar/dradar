name: DeepSeek catalog native regression
on:
  push:
    branches: [codex/0088-catalog-native-qa]
    paths: [".github/workflows/catalog-native.yml", "tests/catalog-ci/**"]
permissions:
  contents: read
concurrency:
  group: catalog-native-qa
  cancel-in-progress: true
jobs:
  regression:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.9.7
          enable-cache: false
      - name: Prepare isolated test dependencies
        shell: bash
        run: |
          uv venv --python 3.12 .qa-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            QA_PYTHON="$GITHUB_WORKSPACE/.qa-venv/Scripts/python.exe"
          else
            QA_PYTHON="$GITHUB_WORKSPACE/.qa-venv/bin/python"
          fi
          echo "QA_PYTHON=$QA_PYTHON" >> "$GITHUB_ENV"
          uv pip install --python "$QA_PYTHON" --require-hashes -r tests/catalog-ci/requirements.lock
      - name: Verify candidate and run synthetic regression only
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code e69e9ff44c69d2de4bf506f91f0aae644af894aa HEAD -- src tests/test_pier_deepseek.py tests/test_deepseek_provider.py tests/test_packaged_adapter_resources.py
          git --version
          "$QA_PYTHON" --version
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy
          "$QA_PYTHON" -m pytest tests/test_pier_deepseek.py tests/test_deepseek_provider.py tests/test_packaged_adapter_resources.py -q --tb=short
          "$QA_PYTHON" tests/catalog-ci/run-probes.py
