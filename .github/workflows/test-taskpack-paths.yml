name: Task pack path safety
on:
  pull_request:
    paths:
      - 'src/dradar/taskpacks.py'
      - 'tests/test_taskpacks.py'
      - '.github/workflows/test-taskpack-paths.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  taskpacks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package runtime and test dependencies
        run: python -m pip install . pytest
      - name: Exercise real task pack installer with private fixtures
        env:
          DRADAR_HOME: ${{ runner.temp }}/dradar-taskpack-test-home
        run: python -m pytest -q tests/test_taskpacks.py
