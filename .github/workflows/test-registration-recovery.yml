name: Worker registration native recovery
on:
  pull_request:
    paths:
      - 'src/dradar/registration.py'
      - 'src/dradar/worker_events.py'
      - 'src/dradar/pier_codex_managed.py'
      - 'src/dradar/runner.py'
      - 'src/dradar/runloop.py'
      - 'src/dradar/flight_recorder.py'
      - 'tests/test_registration*.py'
      - 'tests/test_pier_codex_managed.py'
      - '.github/workflows/test-registration-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-registration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest
      - name: Native socket, worker gate, cancellation and OS file locking
        env:
          PYTHONUTF8: '1'
          DRADAR_HOME: ${{ runner.temp }}/registration-fixture-home
        run: >-
          python -m pytest -q tests/test_registration_recovery.py
          tests/test_registration_native.py tests/test_worker_start_native.py
          --junitxml=evidence/registration.xml
      - name: Actual managed adapter dependency
        if: matrix.python == '3.13'
        run: python -m pip install datacurve-pier==0.3.0
      - name: Managed adapter registration and package resources
        if: matrix.python == '3.13'
        env:
          PYTHONUTF8: '1'
          DRADAR_HOME: ${{ runner.temp }}/managed-registration-fixture-home
        run: >-
          python -m pytest -q tests/test_pier_codex_managed.py::test_managed_readiness_shares_existing_deadline_with_parent
          tests/test_managed_auth_negotiation.py tests/test_packaged_adapter_resources.py
          --junitxml=evidence/managed-package.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-${{ matrix.os }}-${{ matrix.python }}
          path: evidence/*.xml
          retention-days: 7
