name: Prepare pinned public task image dependencies
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [build, accept]
        required: true
      reviewed_commit:
        type: string
        required: true
      batch_sha256:
        type: string
        required: true
      numbers:
        description: JSON array of fixed three-digit image numbers
        type: string
        required: true
      candidate:
        description: Immutable candidate digest; accept phase uses one fixed number
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.phase == 'build' && 'ghcr-environment-publication' || format('ghcr-prepared-image-accept-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'codex-radar/dradar' && github.actor == 'SecurityMind' && github.ref == 'refs/heads/codex/runtime-images-210' && github.sha == inputs.reviewed_commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        number: ${{ fromJSON(inputs.numbers) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: inputs.phase == 'build'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: inputs.phase == 'build'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build or independently pull and probe this exact image
        env:
          PHASE: ${{ inputs.phase }}
          REVIEWED: ${{ inputs.reviewed_commit }}
          BATCH_HASH: ${{ inputs.batch_sha256 }}
          NUMBER: ${{ matrix.number }}
          CANDIDATE: ${{ inputs.candidate }}
        run: python3 images/prepared_runtime/build.py "$PHASE" --number "$NUMBER" --reviewed "$REVIEWED" --batch-hash "$BATCH_HASH" --candidate "$CANDIDATE" --out "$RUNNER_TEMP/dependency-receipt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: prepared-${{ inputs.phase }}-${{ matrix.number }}
          path: |
            ${{ runner.temp }}/dependency-receipt/*.json
            ${{ runner.temp }}/dependency-receipt/*.stdout
            ${{ runner.temp }}/dependency-receipt/*.stderr
            ${{ runner.temp }}/dependency-receipt/Dockerfile
            ${{ runner.temp }}/dependency-receipt/outer/*.json
            ${{ runner.temp }}/dependency-receipt/outer/*.stdout
            ${{ runner.temp }}/dependency-receipt/outer/*.stderr
            ${{ runner.temp }}/dependency-receipt/outer/evidence/execution-environment.json
            ${{ runner.temp }}/dependency-receipt/outer/evidence/ca-preflight/CA_PREFLIGHT.json
            ${{ runner.temp }}/dependency-receipt/outer/evidence/codex/package-lock.json
          if-no-files-found: error
  pompeii_build:
    if: github.repository == 'codex-radar/dradar' && github.actor == 'SecurityMind' && github.ref == 'refs/heads/codex/235-pompeii-inputs' && github.sha == inputs.reviewed_commit && inputs.phase == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build fixed original-input images
        env:
          REVIEWED: ${{ inputs.reviewed_commit }}
        run: python3 images/pompeii_inputs/run.py build --reviewed "$REVIEWED" --out "$RUNNER_TEMP/pompeii-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pompeii-original-input-build
          path: ${{ runner.temp }}/pompeii-build
          if-no-files-found: error
  pompeii_accept:
    needs: pompeii_build
    if: needs.pompeii_build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pompeii-original-input-build
          path: ${{ runner.temp }}/pompeii-build
      - name: Verify anonymous pull, exact inputs and original collector
        env:
          REVIEWED: ${{ inputs.reviewed_commit }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          python3 images/pompeii_inputs/run.py accept --reviewed "$REVIEWED" --build-receipt "$RUNNER_TEMP/pompeii-build/receipt.json" --out "$RUNNER_TEMP/pompeii-accept"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pompeii-original-input-accept
          path: ${{ runner.temp }}/pompeii-accept
          if-no-files-found: error
