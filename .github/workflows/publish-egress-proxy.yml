name: Mirror qualified task004 original ECR image without rebuild
on:
  workflow_dispatch:
    inputs:
      phase:
        description: One package mirror, or separate full anonymous acceptance
        required: true
        type: choice
        options: [mirror, anonymous]
      reviewed_commit:
        description: Exact reviewed branch commit containing the new real qualification
        required: true
        type: string
      qualification_sha256:
        description: SHA256 of immutable QUALIFICATION_PUBLIC.json
        required: true
        type: string
permissions:
  contents: read
# Existing per-package serialization. Manager/129 separately owns the actual
# cross-task shared publication lock/window; this group does not replace it.
concurrency:
  group: ghcr-dradar-env-claude-code-by-agents-recursive-delegation
  cancel-in-progress: false
env:
  PUBLIC_FILES: images/claude-code-by-agents-recursive-delegation/official-mirror
  SOURCE: public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:4baf10f1e66f9ab4d82991e538c13620c387c862974ec36dd5bd5d52f635920e
  IMAGE: ghcr.io/codex-radar/dradar-env-claude-code-by-agents-recursive-delegation
  TAG: official-ecr-4baf10f1e66f9ab4d82991e538c13620c387c862974ec36dd5bd5d52f635920e-amd64-v1
  MANIFEST: sha256:4baf10f1e66f9ab4d82991e538c13620c387c862974ec36dd5bd5d52f635920e
jobs:
  mirror:
    if: inputs.phase == 'mirror' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/fresh64-004-recursive-20261007' && github.actor == 'SecurityMind'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Gate exact reviewed commit and new real-model qualification
        env:
          REVIEWED: ${{ inputs.reviewed_commit }}
          QUALIFICATION_SHA: ${{ inputs.qualification_sha256 }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/official004-publication"
          python3 "$PUBLIC_FILES/verify.py" gate "$PUBLIC_FILES" "$REVIEWED" "$QUALIFICATION_SHA" "$RUNNER_TEMP/official004-publication/GATE.json"
      - name: Install registry copy tool; no image build or model preparation
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo --version > "$RUNNER_TEMP/official004-publication/SKOPEO_VERSION.txt"
      - name: Verify exact source raw manifest, config and all original rootfs IDs
        run: |
          set -euo pipefail
          umask 077
          printf '{"auths":{}}\n' > "$RUNNER_TEMP/official004-empty-auth.json"
          skopeo inspect --authfile "$RUNNER_TEMP/official004-empty-auth.json" --raw "docker://$SOURCE" > "$RUNNER_TEMP/official004-publication/SOURCE_MANIFEST.json"
          skopeo inspect --authfile "$RUNNER_TEMP/official004-empty-auth.json" --config --raw "docker://$SOURCE" > "$RUNNER_TEMP/official004-publication/SOURCE_CONFIG.json"
          python3 "$PUBLIC_FILES/verify.py" identity "$PUBLIC_FILES" "$RUNNER_TEMP/official004-publication/SOURCE_MANIFEST.json" "$RUNNER_TEMP/official004-publication/SOURCE_CONFIG.json" "$RUNNER_TEMP/official004-publication/SOURCE_IDENTITY.json"
      - name: Copy the same manifest/config/layers to only the authorized package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          auth="$RUNNER_TEMP/official004-ghcr-auth.json"
          trap 'rm -f "$auth"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$auth" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests --src-authfile "$RUNNER_TEMP/official004-empty-auth.json" --dest-authfile "$auth" "docker://$SOURCE" "docker://$IMAGE:$TAG"
          skopeo inspect --authfile "$auth" --raw "docker://$IMAGE:$TAG" > "$RUNNER_TEMP/official004-publication/TARGET_MANIFEST.json"
          skopeo inspect --authfile "$auth" --config --raw "docker://$IMAGE@$MANIFEST" > "$RUNNER_TEMP/official004-publication/TARGET_CONFIG.json"
          cmp "$RUNNER_TEMP/official004-publication/SOURCE_MANIFEST.json" "$RUNNER_TEMP/official004-publication/TARGET_MANIFEST.json"
          cmp "$RUNNER_TEMP/official004-publication/SOURCE_CONFIG.json" "$RUNNER_TEMP/official004-publication/TARGET_CONFIG.json"
          python3 "$PUBLIC_FILES/verify.py" identity "$PUBLIC_FILES" "$RUNNER_TEMP/official004-publication/TARGET_MANIFEST.json" "$RUNNER_TEMP/official004-publication/TARGET_CONFIG.json" "$RUNNER_TEMP/official004-publication/MIRROR_IDENTITY.json"
          gh api orgs/codex-radar/packages/container/dradar-env-claude-code-by-agents-recursive-delegation > "$RUNNER_TEMP/official004-package-metadata-raw.json"
          python3 "$PUBLIC_FILES/verify.py" package "$RUNNER_TEMP/official004-package-metadata-raw.json" "$RUNNER_TEMP/official004-publication/PACKAGE_READBACK.json"
          rm "$RUNNER_TEMP/official004-package-metadata-raw.json"
      - name: Preserve only public identity and package-readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task004-original-ecr-mirror-public-receipts
          path: |
            ${{ runner.temp }}/official004-publication/GATE.json
            ${{ runner.temp }}/official004-publication/SKOPEO_VERSION.txt
            ${{ runner.temp }}/official004-publication/SOURCE_MANIFEST.json
            ${{ runner.temp }}/official004-publication/SOURCE_IDENTITY.json
            ${{ runner.temp }}/official004-publication/TARGET_MANIFEST.json
            ${{ runner.temp }}/official004-publication/MIRROR_IDENTITY.json
            ${{ runner.temp }}/official004-publication/PACKAGE_READBACK.json
          if-no-files-found: warn
          retention-days: 14
  anonymous:
    if: inputs.phase == 'anonymous' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/fresh64-004-recursive-20261007' && github.actor == 'SecurityMind'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Gate same reviewed qualification before anonymous acceptance
        env:
          REVIEWED: ${{ inputs.reviewed_commit }}
          QUALIFICATION_SHA: ${{ inputs.qualification_sha256 }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/official004-anonymous"
          python3 "$PUBLIC_FILES/verify.py" gate "$PUBLIC_FILES" "$REVIEWED" "$QUALIFICATION_SHA" "$RUNNER_TEMP/official004-anonymous/GATE.json"
      - name: Read actual Public visibility and repository connection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api orgs/codex-radar/packages/container/dradar-env-claude-code-by-agents-recursive-delegation > "$RUNNER_TEMP/official004-package-metadata-raw.json"
          python3 "$PUBLIC_FILES/verify.py" package "$RUNNER_TEMP/official004-package-metadata-raw.json" "$RUNNER_TEMP/official004-anonymous/PACKAGE_PUBLIC_READBACK.json" --require-public
          rm "$RUNNER_TEMP/official004-package-metadata-raw.json"
      - name: Install registry-read tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Full anonymous pull in a new empty Docker data root
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN DOCKER_AUTH_CONFIG REGISTRY_AUTH_FILE DOCKER_CONTEXT
          python3 "$PUBLIC_FILES/anonymous_pull.py" "$PUBLIC_FILES" "$RUNNER_TEMP/official004-anonymous"
      - name: Preserve only complete anonymous acceptance receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task004-original-ecr-full-anonymous-public-receipts
          path: |
            ${{ runner.temp }}/official004-anonymous/GATE.json
            ${{ runner.temp }}/official004-anonymous/PACKAGE_PUBLIC_READBACK.json
            ${{ runner.temp }}/official004-anonymous/ANONYMOUS_PULL_RECEIPT.json
            ${{ runner.temp }}/official004-anonymous/ANONYMOUS_DOCKER_PULL.log
            ${{ runner.temp }}/official004-anonymous/ANONYMOUS_MANIFEST.json
            ${{ runner.temp }}/official004-anonymous/ANONYMOUS_IDENTITY.json
          if-no-files-found: warn
          retention-days: 14
