name: Copy or verify the unchanged official Bandit environment
on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [copy, verify_anonymous]
      reviewed_commit:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dradar-qualified-environment-publication
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/codex-radar/dradar-env-bandit-interprocedural-taint-checks
  SOURCE_REFERENCE: public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:7207179b09db76a8a3864b9e69c5fdf10e0d41a5bba242854216f18aa90ac7b1
  SOURCE_DIGEST: sha256:7207179b09db76a8a3864b9e69c5fdf10e0d41a5bba242854216f18aa90ac7b1
  CONFIG_ID: sha256:24d48828a38a60d1a9773b464d25cb25ca94f0fa9a214b08faf2fde8446c2f75
  TASK_FILES: images/bandit-interprocedural-taint-checks/official-copy
jobs:
  copy:
    if: inputs.operation == 'copy' && github.repository == 'codex-radar/dradar' && github.actor == 'SecurityMind' && github.ref == 'refs/heads/codex/fresh64-003-env-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require the exact reviewed branch commit
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${REVIEWED_COMMIT}"
          test "$(git rev-parse HEAD)" = "${REVIEWED_COMMIT}"
          test -z "$(git status --porcelain)"
          python3 -c 'import os,re; assert re.fullmatch("[a-f0-9]{40}",os.environ["REVIEWED_COMMIT"])'
          mkdir -m 700 "${RUNNER_TEMP}/bandit-official-copy-evidence"
      - name: Install the official archive-copy tool
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
          skopeo --version | tee "${RUNNER_TEMP}/bandit-official-copy-evidence/SKOPEO_VERSION.txt"
      - name: Validate the unchanged official source without credentials
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/bandit-official-copy-evidence"
          skopeo inspect --raw --no-creds "docker://${SOURCE_REFERENCE}" > "${evidence}/SOURCE_MANIFEST.json"
          skopeo --override-os linux --override-arch amd64 inspect --config --raw --no-creds "docker://${SOURCE_REFERENCE}" > "${evidence}/SOURCE_CONFIG.json"
          python3 "${TASK_FILES}/verify_official_identity.py" registry --identity "${TASK_FILES}/OFFICIAL_IMAGE.json" --evidence "${evidence}"
      - name: Copy all official manifests and layers without conversion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence="${RUNNER_TEMP}/bandit-official-copy-evidence"
          authfile="$(mktemp "${RUNNER_TEMP}/bandit-ghcr-auth.XXXXXX")"
          trap 'rm -f -- "${authfile}"' EXIT
          printf '{}\n' > "${authfile}"
          chmod 0600 "${authfile}"
          test "$(stat -c '%a' "${authfile}")" = 600
          printf '%s' "${GH_TOKEN}" | skopeo login --authfile "${authfile}" --username "${GITHUB_ACTOR}" --password-stdin ghcr.io
          chmod 0600 "${authfile}"
          test "$(stat -c '%a' "${authfile}")" = 600
          target="${IMAGE}:official-source-${GITHUB_SHA}-amd64"
          skopeo copy --all --preserve-digests --src-no-creds --authfile "${authfile}" --digestfile "${evidence}/COPY_DIGEST.txt" "docker://${SOURCE_REFERENCE}" "docker://${target}" | tee "${evidence}/COPY.log"
          skopeo inspect --raw --authfile "${authfile}" "docker://${IMAGE}@${SOURCE_DIGEST}" > "${evidence}/PUBLISHED_MANIFEST.json"
          skopeo --override-os linux --override-arch amd64 inspect --config --raw --authfile "${authfile}" "docker://${IMAGE}@${SOURCE_DIGEST}" > "${evidence}/PUBLISHED_CONFIG.json"
          gh api orgs/codex-radar/packages/container/dradar-env-bandit-interprocedural-taint-checks --jq '{name:.name,visibility:.visibility,repository:(.repository.full_name // null)}' > "${evidence}/PACKAGE_METADATA.json"
          python3 "${TASK_FILES}/verify_official_identity.py" copy --identity "${TASK_FILES}/OFFICIAL_IMAGE.json" --evidence "${evidence}"
      - name: Preserve copy receipts without registry credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh64-003-official-copy-${{ github.sha }}
          path: ${{ runner.temp }}/bandit-official-copy-evidence
          if-no-files-found: error
  verify-anonymous:
    if: inputs.operation == 'verify_anonymous' && github.repository == 'codex-radar/dradar' && github.actor == 'SecurityMind' && github.ref == 'refs/heads/codex/fresh64-003-env-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pull every official layer using an empty config and new daemon
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${REVIEWED_COMMIT}"
          test "$(git rev-parse HEAD)" = "${REVIEWED_COMMIT}"
          test -z "$(git status --porcelain)"
          python3 -c 'import os,re; assert re.fullmatch("[a-f0-9]{40}",os.environ["REVIEWED_COMMIT"])'
          evidence="${RUNNER_TEMP}/bandit-official-anonymous-evidence"
          mkdir -m 700 "${evidence}"
          export DOCKER_CONFIG="${RUNNER_TEMP}/bandit-official-anonymous-config"
          mkdir -m 700 "${DOCKER_CONFIG}"
          printf '{}\n' > "${DOCKER_CONFIG}/config.json"
          socket="${RUNNER_TEMP}/bandit-official-anonymous.sock"
          pidfile="${RUNNER_TEMP}/bandit-official-anonymous.pid"
          sudo dockerd --host "unix://${socket}" --data-root "${RUNNER_TEMP}/bandit-official-anonymous-data" --exec-root "${RUNNER_TEMP}/bandit-official-anonymous-exec" --pidfile "${pidfile}" --bridge=none --iptables=false --ip6tables=false --ip-forward=false > "${evidence}/ANONYMOUS_DAEMON.log" 2>&1 &
          owned_launcher=$!
          cleanup() {
            result=$?
            if test -s "${pidfile}"; then
              owned_daemon="$(cat "${pidfile}")"
              sudo kill "${owned_daemon}" || true
              for i in $(seq 1 30); do
                if ! sudo kill -0 "${owned_daemon}" 2>/dev/null; then break; fi
                sleep 1
              done
              if sudo kill -0 "${owned_daemon}" 2>/dev/null; then
                printf 'Owned anonymous daemon exit not verified\n' > "${evidence}/DAEMON_EXIT_FAILURE.txt"
                result=1
              else
                printf '{"owned_daemon_exit_verified":true,"pid":%s}\n' "${owned_daemon}" > "${evidence}/ANONYMOUS_DAEMON_EXIT.json"
                wait "${owned_launcher}" || true
              fi
            fi
            exit "${result}"
          }
          trap cleanup EXIT
          export DOCKER_HOST="unix://${socket}"
          for i in $(seq 1 90); do if docker info >/dev/null 2>&1; then break; fi; sleep 1; done
          docker info >/dev/null
          docker images --quiet > "${evidence}/INITIAL_IMAGES.txt"
          test ! -s "${evidence}/INITIAL_IMAGES.txt"
          docker pull --platform linux/amd64 "${IMAGE}@${SOURCE_DIGEST}" | tee "${evidence}/ANONYMOUS_DOCKER_PULL.log"
          docker image inspect "${IMAGE}@${SOURCE_DIGEST}" > "${evidence}/ANONYMOUS_IMAGE.json"
          python3 "${TASK_FILES}/verify_official_identity.py" anonymous --identity "${TASK_FILES}/OFFICIAL_IMAGE.json" --evidence "${evidence}"
      - name: Preserve the complete anonymous pull and exit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh64-003-official-anonymous-${{ github.sha }}
          path: ${{ runner.temp }}/bandit-official-anonymous-evidence
          if-no-files-found: error
