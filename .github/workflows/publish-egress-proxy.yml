name: Build pinned Science19 official-source Agent environments
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Build official Agent contexts, or independently verify public anonymous pulls
        required: true
        type: choice
        options: [build, anonymous, verifier-build, verifier-anonymous, runtime]
      reviewed_commit:
        description: Exact reviewed isolated Science branch commit
        required: true
        type: string
      batch_sha256:
        description: Fixed19 BATCH.json SHA256
        required: true
        type: string
      build_run:
        description: Previous successful build run for anonymous verification
        required: false
        type: string
      build_commit:
        description: Exact original build commit, if anonymous verifier code advanced
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ghcr-environment-publication
  cancel-in-progress: false
jobs:
  science:
    if: github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/science19-official-build-20261008' && github.actor == 'SecurityMind' && github.sha == inputs.reviewed_commit
    runs-on: ubuntu-latest
    timeout-minutes: 135
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        number: ['046', '047', '048', '049', '050', '051', '052', '053', '054', '055', '056', '057', '058', '059', '060', '061', '062', '063', '064']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install registry inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: inputs.phase == 'build' || inputs.phase == 'verifier-build'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: inputs.phase == 'build' || inputs.phase == 'verifier-build'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Execute this fixed Science image step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE: ${{ inputs.phase }}
          REVIEWED: ${{ inputs.reviewed_commit }}
          BATCH_HASH: ${{ inputs.batch_sha256 }}
          BUILD_RUN: ${{ inputs.build_run }}
          BUILD_COMMIT: ${{ inputs.build_commit }}
          NUMBER: ${{ matrix.number }}
        run: |
          set -euo pipefail
          python3 images/science19/build.py "$PHASE" --root images/science19 --out "$RUNNER_TEMP/science-public-receipts" --reviewed "$REVIEWED" --batch-hash "$BATCH_HASH" --number "$NUMBER" --build-run "$BUILD_RUN" --build-reviewed "$BUILD_COMMIT"
      - name: Preserve only public source-build or verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: science19-${{ inputs.phase }}-${{ matrix.number }}
          path: |
            ${{ runner.temp }}/science-public-receipts/SOURCE_RECEIPT.json
            ${{ runner.temp }}/science-public-receipts/UPSTREAM_LICENSE
            ${{ runner.temp }}/science-public-receipts/BUILD_METADATA.json
            ${{ runner.temp }}/science-public-receipts/BUILD_RECEIPT.json
            ${{ runner.temp }}/science-public-receipts/BUILD.log
            ${{ runner.temp }}/science-public-receipts/MANIFEST.json
            ${{ runner.temp }}/science-public-receipts/CONFIG.json
            ${{ runner.temp }}/science-public-receipts/FAILURE.json
            ${{ runner.temp }}/science-public-receipts/ANONYMOUS_RECEIPT.json
            ${{ runner.temp }}/science-public-receipts/ANONYMOUS_PULL.log
            ${{ runner.temp }}/science-public-receipts/PUBLIC_PACKAGE.json
            ${{ runner.temp }}/science-public-receipts/DOCKERD.log
            ${{ runner.temp }}/science-public-receipts/DAEMON_EXIT.json
            ${{ runner.temp }}/science-public-receipts/RUNTIME_RECEIPT.json
          retention-days: 30
          if-no-files-found: warn
