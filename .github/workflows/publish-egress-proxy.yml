name: Publish data-free DRadar Pompeii agent and verifier runtimes
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Build generic runtime, or verify its public anonymous full pull
        required: true
        type: choice
        options: [build, anonymous]
      reviewed_commit:
        description: Exact reviewed isolated branch commit
        required: true
        type: string
      context_sha256:
        description: SHA256 of the exact two-file agent runtime build context
        required: true
        type: string
      verifier_context_sha256:
        description: SHA256 of the exact two-file verifier runtime build context
        required: true
        type: string
      image_digest:
        description: Agent build receipt manifest digest; required for anonymous phase
        required: false
        default: ''
        type: string
      verifier_image_digest:
        description: Verifier build receipt manifest digest; required for anonymous phase
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: ghcr-environment-publication
  cancel-in-progress: false
env:
  PUBLIC_FILES: images/pompeii-runtime-ci
  BUILD_CONTEXT: images/pompeii-runtime
  VERIFIER_BUILD_CONTEXT: images/pompeii-verifier-runtime
jobs:
  build:
    if: inputs.phase == 'build' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/pompeii-generic-runtime-20261008' && github.actor == 'SecurityMind' && github.sha == inputs.reviewed_commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official registry inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Build and publish only the data-free generic runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED: ${{ inputs.reviewed_commit }}
          CONTEXT_HASH: ${{ inputs.context_sha256 }}
          VERIFIER_CONTEXT_HASH: ${{ inputs.verifier_context_sha256 }}
        run: |
          set -euo pipefail
          python3 "$PUBLIC_FILES/runtime.py" context --runtime agent --context "$BUILD_CONTEXT" --context-sha256 "$CONTEXT_HASH"
          python3 "$PUBLIC_FILES/runtime.py" context --runtime verifier --context "$VERIFIER_BUILD_CONTEXT" --context-sha256 "$VERIFIER_CONTEXT_HASH"
          python3 "$PUBLIC_FILES/runtime.py" build --runtime agent --context "$BUILD_CONTEXT" --out "$RUNNER_TEMP/pompeii-agent-runtime-build" --reviewed "$REVIEWED" --context-sha256 "$CONTEXT_HASH"
          python3 "$PUBLIC_FILES/runtime.py" build --runtime verifier --context "$VERIFIER_BUILD_CONTEXT" --out "$RUNNER_TEMP/pompeii-verifier-runtime-build" --reviewed "$REVIEWED" --context-sha256 "$VERIFIER_CONTEXT_HASH"
      - name: Preserve only non-sensitive build receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pompeii-generic-runtime-build
          path: |
            ${{ runner.temp }}/pompeii-agent-runtime-build/public/
            ${{ runner.temp }}/pompeii-verifier-runtime-build/public/
          retention-days: 30
          if-no-files-found: warn
  anonymous:
    if: inputs.phase == 'anonymous' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/pompeii-generic-runtime-20261008' && github.actor == 'SecurityMind' && github.sha == inputs.reviewed_commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official registry inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Verify public metadata and complete isolated anonymous pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED: ${{ inputs.reviewed_commit }}
          CONTEXT_HASH: ${{ inputs.context_sha256 }}
          VERIFIER_CONTEXT_HASH: ${{ inputs.verifier_context_sha256 }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          VERIFIER_IMAGE_DIGEST: ${{ inputs.verifier_image_digest }}
        run: |
          set -euo pipefail
          python3 "$PUBLIC_FILES/runtime.py" anonymous --runtime agent --context "$BUILD_CONTEXT" --out "$RUNNER_TEMP/pompeii-agent-runtime-anonymous" --reviewed "$REVIEWED" --context-sha256 "$CONTEXT_HASH" --digest "$IMAGE_DIGEST"
          python3 "$PUBLIC_FILES/runtime.py" anonymous --runtime verifier --context "$VERIFIER_BUILD_CONTEXT" --out "$RUNNER_TEMP/pompeii-verifier-runtime-anonymous" --reviewed "$REVIEWED" --context-sha256 "$VERIFIER_CONTEXT_HASH" --digest "$VERIFIER_IMAGE_DIGEST"
      - name: Preserve only non-sensitive anonymous receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pompeii-generic-runtime-anonymous
          path: |
            ${{ runner.temp }}/pompeii-agent-runtime-anonymous/public/
            ${{ runner.temp }}/pompeii-verifier-runtime-anonymous/public/
          retention-days: 30
          if-no-files-found: warn
