name: Publish or verify qualified fixed Bandit environment
on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        default: publish
        type: choice
        options: [publish, verify_anonymous]
      reviewed_commit:
        required: true
        type: string
      archive_url:
        description: Same qualified Docker archive release asset; never rebuild
        required: false
        type: string
      digest:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: dradar-qualified-environment-publication
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/codex-radar/dradar-env-bandit-interprocedural-taint-checks
  ARCHIVE_SHA: d89c0543835d94b2ae5f467ce473cde74bf3c3206ce2c77233e9f9b55f9e80b3
  CONFIG_ID: sha256:29f3ea332413c914fe276c03b110fec3ef12eb781298b6b57503b23fe4da938a
jobs:
  publish:
    if: inputs.operation == 'publish' && github.repository == 'codex-radar/dradar' && github.actor == 'SecurityMind' && github.ref == 'refs/heads/codex/fresh64-003-env-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Load and verify the already qualified artifact
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          ARCHIVE_URL: ${{ inputs.archive_url }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${REVIEWED_COMMIT}"
          python3 - <<'PY'
          import os,re
          from urllib.parse import urlsplit
          p=urlsplit(os.environ['ARCHIVE_URL'])
          assert p.scheme=='https' and p.hostname=='github.com' and p.path.startswith('/codex-radar/dradar/releases/download/fresh64-003-env-') and p.path.endswith('/fixed-clean-image.tar.gz') and not p.query and not p.fragment
          assert re.fullmatch('[0-9a-f]{40}',os.environ['REVIEWED_COMMIT'])
          PY
          curl --fail --location --retry 2 --output "${RUNNER_TEMP}/fixed-clean-image.tar.gz" "${ARCHIVE_URL}"
          printf '%s  %s\n' "${ARCHIVE_SHA}" "${RUNNER_TEMP}/fixed-clean-image.tar.gz" | sha256sum --check
          gzip -dc "${RUNNER_TEMP}/fixed-clean-image.tar.gz" | docker image load
          test "$(docker image inspect --format '{{.Id}}' "${CONFIG_ID}")" = "${CONFIG_ID}"
          docker image inspect "${CONFIG_ID}" > "${RUNNER_TEMP}/LOADED_IMAGE.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'LOADED_IMAGE.json').read_text())[0]
          assert d['RootFS']['Layers']==['sha256:abe743884ea0f81e9c440e82f83e69d90f4a9c127436d36b77b0aae5eb96ce25', 'sha256:9bb1d272ab0d3d1df8839cd5bf08c58b807bf38ac61d77dfe50e7da84afc21b3', 'sha256:70fc8a9dea828d02e41b2d9257e1a0de82f3d853a02961c593b17583685f2d8c', 'sha256:73c130b00770ddd49459887acfaefd067359353d8c336b40f001abf88e7cc5d8', 'sha256:56e0bb07b9c315fca33d615253fecf504ffa68a17e743fb1a5850b0b66b8ff4c', 'sha256:1a267510db20c6f18eeeb21bcac120fce5f88bda28450c99135f0a1274fc1908', 'sha256:e47ba642bbdd47c1008c632bca084b788065813c75f75a94cdb83fcdbd46e7c4', 'sha256:18bad15f40e3f8fbe15a85e3391de78e5c7bf553bf809a3e26243c6dbb6cdeaa', 'sha256:a5bf3e8b17341d6c2ce0121048383f049d23745da8e9cae0f14d36089626039e', 'sha256:e7e72abe56070a9558f5d94592bda33424a67b277d8ab9e48306b33a5842ccfe', 'sha256:f0b9a136d9dadf0cf6973857821de01cc6b325ad339406a2e8b557baf0303273', 'sha256:63e6c3e4fbf4a90acb8f3c5bebb76950753749009e80e7ef7323aa4123d19fde', 'sha256:7a7b82ed9e6d06e497c4ed3208f38da119893f9a8519d0fd4615dd2ab9d0966d', 'sha256:6ba4bf4b7ad25679e4c29562d212acfd8cade34b74688eb26f095e77fc8a302b', 'sha256:5c2c8a930e0cca455854c6b7c6d31fbbaedad9dcbdf940a0dd48873cca13c3ca', 'sha256:9cc89772083d6e2731d133165bcc9ef165e7aaf9aa31721883bdaea5ee1dbf9a', 'sha256:96b80a683a163743a549ac33ed5bc0f46802b7dc76b4a0d45118ae759899d439', 'sha256:6fb3cae97d2174172062200ede630f67b35482d22b127a16dc878c95c29f3e79', 'sha256:55cd52519b4e37e25ac4917cfe60a1ebba692277edff8dbd80dc269dd7a00b6d', 'sha256:e0fdce38a4dc2e791adb7115f34b6aa242601c92b5a1d2f1b6517a07051231f8', 'sha256:d256697eeabbbac1884e8b6df16e9f80780b8f99c713983e65d82121ec045fd8', 'sha256:3fcf601d5c7fc2ae64728e0e7be7e2ae0fa1d0beda62dc2e1cdc51ca97e3ddb4', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:055a8817b2d5dc185b1b1f1e3fe1e59dd631677d05e135d8cb1baa29074b1d4e', 'sha256:a1230b58dbf7196f7c88b056aaba5356c57fb18b15c835b55b38eda18b003ee9', 'sha256:b1e3024d87e140e2b6c59d4a43723f5c85b609002b2dc64e36069b956dc4f8ac', 'sha256:a5a29aec172fd52f05ffeb8b2bfc79d327c29fd7b8310edb9d54843cd2cbe940']
          PY
          docker tag "${CONFIG_ID}" "${IMAGE}:fresh64-003-qualified-${GITHUB_SHA}-amd64"
      - name: Sign in with the repository's temporary token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the loaded image without a rebuild
        id: push
        shell: bash
        run: |
          set -euo pipefail
          tag="${IMAGE}:fresh64-003-qualified-${GITHUB_SHA}-amd64"
          docker push "${tag}" | tee "${RUNNER_TEMP}/PUSH.log"
          digest="$(sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' "${RUNNER_TEMP}/PUSH.log" | tail -n1)"
          test -n "${digest}"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf '%s@%s\n' "${IMAGE}" "${digest}" > "${RUNNER_TEMP}/PUBLISHED_REFERENCE.txt"
      - name: Verify package repository association and record visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh api orgs/codex-radar/packages/container/dradar-env-bandit-interprocedural-taint-checks --jq '{name:.name,visibility:.visibility,repository:(.repository.full_name // null)}' > "${RUNNER_TEMP}/PACKAGE_METADATA.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']);m=json.loads((p/'PACKAGE_METADATA.json').read_text())
          assert m['name']=='dradar-env-bandit-interprocedural-taint-checks'
          assert m['repository']=='codex-radar/dradar'
          r={'reference':os.environ['IMAGE']+'@'+os.environ['DIGEST'],'config_id':os.environ['CONFIG_ID'],'archive_sha256':os.environ['ARCHIVE_SHA'],'visibility':m['visibility'],'repository':m['repository'],'actor':os.environ['GITHUB_ACTOR'],'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'image_rebuilt':False,'anonymous_pull_complete':False}
          (p/'PUBLISH_RECEIPT.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Preserve image and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh64-003-publication-${{ github.sha }}
          path: |
            ${{ runner.temp }}/LOADED_IMAGE.json
            ${{ runner.temp }}/PUSH.log
            ${{ runner.temp }}/PUBLISHED_REFERENCE.txt
            ${{ runner.temp }}/PACKAGE_METADATA.json
            ${{ runner.temp }}/PUBLISH_RECEIPT.json
          if-no-files-found: error
  verify-anonymous:
    if: inputs.operation == 'verify_anonymous' && github.repository == 'codex-radar/dradar' && github.actor == 'SecurityMind' && github.ref == 'refs/heads/codex/fresh64-003-env-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull every layer using an empty Docker configuration and fresh daemon
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          DIGEST: ${{ inputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${REVIEWED_COMMIT}"
          python3 - <<'PY'
          import os,re
          assert re.fullmatch('sha256:[a-f0-9]{64}',os.environ['DIGEST'])
          assert re.fullmatch('[a-f0-9]{40}',os.environ['REVIEWED_COMMIT'])
          PY
          export DOCKER_CONFIG="${RUNNER_TEMP}/bandit-anonymous-config"
          mkdir -m 700 "${DOCKER_CONFIG}"
          printf '{}\n' > "${DOCKER_CONFIG}/config.json"
          socket="${RUNNER_TEMP}/bandit-anonymous.sock"
          pidfile="${RUNNER_TEMP}/bandit-anonymous.pid"
          sudo dockerd --host "unix://${socket}" --data-root "${RUNNER_TEMP}/bandit-anonymous-data" --exec-root "${RUNNER_TEMP}/bandit-anonymous-exec" --pidfile "${pidfile}" --bridge=none --iptables=false --ip6tables=false --ip-forward=false > "${RUNNER_TEMP}/ANONYMOUS_DAEMON.log" 2>&1 &
          owned_launcher=$!
          trap 'if test -f "${pidfile}"; then sudo kill "$(cat "${pidfile}")"; fi; wait "${owned_launcher}" || true' EXIT
          export DOCKER_HOST="unix://${socket}"
          for i in $(seq 1 90); do if docker info >/dev/null 2>&1; then break; fi; sleep 1; done
          test -z "$(docker images --quiet)"
          docker pull --platform linux/amd64 "${IMAGE}@${DIGEST}" | tee "${RUNNER_TEMP}/ANONYMOUS_DOCKER_PULL.log"
          docker image inspect "${IMAGE}@${DIGEST}" > "${RUNNER_TEMP}/ANONYMOUS_IMAGE.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP']);d=json.loads((p/'ANONYMOUS_IMAGE.json').read_text())[0]
          assert d['Id']==os.environ['CONFIG_ID']
          assert d['Os']=='linux' and d['Architecture']=='amd64'
          assert d['Config']['WorkingDir']=='/app'
          assert d['RootFS']['Layers']==['sha256:abe743884ea0f81e9c440e82f83e69d90f4a9c127436d36b77b0aae5eb96ce25', 'sha256:9bb1d272ab0d3d1df8839cd5bf08c58b807bf38ac61d77dfe50e7da84afc21b3', 'sha256:70fc8a9dea828d02e41b2d9257e1a0de82f3d853a02961c593b17583685f2d8c', 'sha256:73c130b00770ddd49459887acfaefd067359353d8c336b40f001abf88e7cc5d8', 'sha256:56e0bb07b9c315fca33d615253fecf504ffa68a17e743fb1a5850b0b66b8ff4c', 'sha256:1a267510db20c6f18eeeb21bcac120fce5f88bda28450c99135f0a1274fc1908', 'sha256:e47ba642bbdd47c1008c632bca084b788065813c75f75a94cdb83fcdbd46e7c4', 'sha256:18bad15f40e3f8fbe15a85e3391de78e5c7bf553bf809a3e26243c6dbb6cdeaa', 'sha256:a5bf3e8b17341d6c2ce0121048383f049d23745da8e9cae0f14d36089626039e', 'sha256:e7e72abe56070a9558f5d94592bda33424a67b277d8ab9e48306b33a5842ccfe', 'sha256:f0b9a136d9dadf0cf6973857821de01cc6b325ad339406a2e8b557baf0303273', 'sha256:63e6c3e4fbf4a90acb8f3c5bebb76950753749009e80e7ef7323aa4123d19fde', 'sha256:7a7b82ed9e6d06e497c4ed3208f38da119893f9a8519d0fd4615dd2ab9d0966d', 'sha256:6ba4bf4b7ad25679e4c29562d212acfd8cade34b74688eb26f095e77fc8a302b', 'sha256:5c2c8a930e0cca455854c6b7c6d31fbbaedad9dcbdf940a0dd48873cca13c3ca', 'sha256:9cc89772083d6e2731d133165bcc9ef165e7aaf9aa31721883bdaea5ee1dbf9a', 'sha256:96b80a683a163743a549ac33ed5bc0f46802b7dc76b4a0d45118ae759899d439', 'sha256:6fb3cae97d2174172062200ede630f67b35482d22b127a16dc878c95c29f3e79', 'sha256:55cd52519b4e37e25ac4917cfe60a1ebba692277edff8dbd80dc269dd7a00b6d', 'sha256:e0fdce38a4dc2e791adb7115f34b6aa242601c92b5a1d2f1b6517a07051231f8', 'sha256:d256697eeabbbac1884e8b6df16e9f80780b8f99c713983e65d82121ec045fd8', 'sha256:3fcf601d5c7fc2ae64728e0e7be7e2ae0fa1d0beda62dc2e1cdc51ca97e3ddb4', 'sha256:5f70bf18a086007016e948b04aed3b82103a36bea41755b6cddfaf10ace3c6ef', 'sha256:055a8817b2d5dc185b1b1f1e3fe1e59dd631677d05e135d8cb1baa29074b1d4e', 'sha256:a1230b58dbf7196f7c88b056aaba5356c57fb18b15c835b55b38eda18b003ee9', 'sha256:b1e3024d87e140e2b6c59d4a43723f5c85b609002b2dc64e36069b956dc4f8ac', 'sha256:a5a29aec172fd52f05ffeb8b2bfc79d327c29fd7b8310edb9d54843cd2cbe940']
          assert os.environ['IMAGE']+'@'+os.environ['DIGEST'] in d['RepoDigests']
          r={'status':'FULL_ANONYMOUS_PULL_FIXED_CONFIG_VERIFIED','reference':os.environ['IMAGE']+'@'+os.environ['DIGEST'],'config_id':d['Id'],'rootfs_diff_ids':d['RootFS']['Layers'],'fresh_empty_daemon':True,'empty_Docker_config':True,'registry_login':False,'repository':os.environ['GITHUB_REPOSITORY'],'actor':os.environ['GITHUB_ACTOR'],'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA']}
          (p/'ANONYMOUS_PULL_RECEIPT.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
      - name: Preserve anonymous pull evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh64-003-anonymous-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ANONYMOUS_DOCKER_PULL.log
            ${{ runner.temp }}/ANONYMOUS_IMAGE.json
            ${{ runner.temp }}/ANONYMOUS_PULL_RECEIPT.json
            ${{ runner.temp }}/ANONYMOUS_DAEMON.log
          if-no-files-found: error
