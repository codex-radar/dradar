name: Mirror Terminal-Bench14 original environment and verifier images
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Copy 28 original images or verify three fresh anonymous groups
        required: true
        type: choice
        options: [mirror, anonymous]
      reviewed_commit:
        description: Full reviewed isolated branch commit
        required: true
        type: string
      batch_sha256:
        description: Fixed 28-row BATCH SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ghcr-environment-publication
  cancel-in-progress: false
env:
  PUBLIC_FILES: images/terminalbench14-mirror
jobs:
  mirror:
    if: inputs.phase == 'mirror' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/terminalbench14-official-mirror-20261008' && github.actor == 'SecurityMind' && github.sha == inputs.reviewed_commit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official registry-copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo --version
      - name: Copy the fixed 28 original images with unchanged digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED: ${{ inputs.reviewed_commit }}
          BATCH_HASH: ${{ inputs.batch_sha256 }}
        run: |
          set -euo pipefail
          python3 "$PUBLIC_FILES/mirror.py" mirror --root "$PUBLIC_FILES" --out "$RUNNER_TEMP/tb14-copy" --reviewed "$REVIEWED" --batch-hash "$BATCH_HASH"
      - name: Preserve scoped copy receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tb14-official-copy
          path: |
            ${{ runner.temp }}/tb14-copy/0??-env/*.json
            ${{ runner.temp }}/tb14-copy/0??-verifier/*.json
            ${{ runner.temp }}/tb14-copy/0??-env/*.log
            ${{ runner.temp }}/tb14-copy/0??-verifier/*.log
            ${{ runner.temp }}/tb14-copy/BATCH_COPY_RECEIPT.json
          retention-days: 30
          if-no-files-found: warn
  anonymous:
    if: inputs.phase == 'anonymous' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/terminalbench14-official-mirror-20261008' && github.actor == 'SecurityMind' && github.sha == inputs.reviewed_commit
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official registry-read tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Verify Public metadata and complete fresh anonymous pulls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED: ${{ inputs.reviewed_commit }}
          BATCH_HASH: ${{ inputs.batch_sha256 }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          python3 "$PUBLIC_FILES/mirror.py" anonymous --root "$PUBLIC_FILES" --out "$RUNNER_TEMP/tb14-anonymous-$GROUP" --reviewed "$REVIEWED" --batch-hash "$BATCH_HASH" --group "$GROUP"
      - name: Preserve scoped anonymous receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tb14-full-anonymous-pull-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/tb14-anonymous-${{ matrix.group }}/0??-env/*.json
            ${{ runner.temp }}/tb14-anonymous-${{ matrix.group }}/0??-verifier/*.json
            ${{ runner.temp }}/tb14-anonymous-${{ matrix.group }}/0??-env/*.log
            ${{ runner.temp }}/tb14-anonymous-${{ matrix.group }}/0??-verifier/*.log
            ${{ runner.temp }}/tb14-anonymous-${{ matrix.group }}/BATCH_ANONYMOUS_RECEIPT.json
            ${{ runner.temp }}/tb14-anonymous-${{ matrix.group }}/DAEMON_EXIT_RECEIPT.json
            ${{ runner.temp }}/tb14-anonymous-${{ matrix.group }}/DOCKERD.log
          retention-days: 30
          if-no-files-found: warn
