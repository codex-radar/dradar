name: Prepare and publish exact qualified recursive environment
on:
  workflow_dispatch:
    inputs:
      phase:
        required: true
        type: choice
        options: [prepare, publish, anonymous]
      reviewed_commit:
        required: true
        type: string
      prepare_run_id:
        required: false
        type: string
      archive_sha256:
        required: false
        type: string
      manifest_digest:
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ghcr-dradar-env-claude-code-by-agents-recursive-delegation
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/codex-radar/dradar-env-claude-code-by-agents-recursive-delegation
jobs:
  prepare:
    if: inputs.phase == 'prepare' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/recursive-env-ghcr-109-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check reviewed commit and public context
        env:
          REVIEWED: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$REVIEWED"
          test -z "$(git status --porcelain)"
          python3 images/claude-code-by-agents-recursive-delegation/validate_context.py
          mkdir -p "$RUNNER_TEMP/recursive109-evidence"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build ONCE to final OCI archive; do not push registry
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: images/claude-code-by-agents-recursive-delegation/context
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=${{ runner.temp }}/recursive109-evidence/candidate.oci.tar
      - name: Import exact config and layers for no-model content audit
        run: |
          set -euo pipefail
          python3 images/claude-code-by-agents-recursive-delegation/oci_to_docker.py "$RUNNER_TEMP/recursive109-evidence/candidate.oci.tar" "$RUNNER_TEMP/candidate.docker.tar" "$RUNNER_TEMP/recursive109-evidence/FROZEN_ARTIFACT.json" dradar-recursive109:review
          docker load --input "$RUNNER_TEMP/candidate.docker.tar"
          rm "$RUNNER_TEMP/candidate.docker.tar"
          python3 images/claude-code-by-agents-recursive-delegation/audit_image.py
          cp images/claude-code-by-agents-recursive-delegation/oci_to_docker.py "$RUNNER_TEMP/recursive109-evidence/oci_to_docker.py"
          cp images/claude-code-by-agents-recursive-delegation/PROVENANCE.json "$RUNNER_TEMP/recursive109-evidence/PROVENANCE.json"
          cp images/claude-code-by-agents-recursive-delegation/SOURCE_IMAGE.json "$RUNNER_TEMP/recursive109-evidence/SOURCE_IMAGE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recursive-environment-109-frozen
          path: ${{ runner.temp }}/recursive109-evidence
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
