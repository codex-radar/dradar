name: Publish reviewed ABS environment pilot

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish once or verify the existing digest anonymously
        required: true
        default: publish
        type: choice
        options: [publish, verify_anonymous]
      digest:
        description: Existing published immutable digest for anonymous verification
        required: false
        type: string
      reviewed_commit:
        description: Exact reviewed ABS pilot branch commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-dradar-env-abs-module-cache-flags
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/codex-radar/dradar-env-abs-module-cache-flags

jobs:
  publish:
    if: inputs.operation != 'verify_anonymous' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/abs-env-ghcr-109-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact reviewed source and public context
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${REVIEWED_COMMIT}"
          test "$(git rev-parse HEAD)" = "${REVIEWED_COMMIT}"
          test -z "$(git status --porcelain)"
          python3 images/abs-module-cache-flags/validate_context.py
          df -h "${RUNNER_TEMP}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build the single amd64 environment locally on this GitHub runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: images/abs-module-cache-flags/context
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: dradar-abs109:review
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Check baseline, tools, source layers, and forbidden content without a model
        run: python3 images/abs-module-cache-flags/audit_image.py
      - name: Sign in with the repository's temporary GitHub token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only the approved environment package
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: images/abs-module-cache-flags/context
          platforms: linux/amd64
          push: true
          provenance: mode=min
          sbom: true
          cache-to: type=inline
          tags: ${{ env.IMAGE }}:abs-prepared-v1-${{ github.sha }}-amd64
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
      - name: Sign and record the actual immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw > "${RUNNER_TEMP}/abs109-evidence/PUBLISHED_MANIFEST.json"
          gh api orgs/codex-radar/packages/container/dradar-env-abs-module-cache-flags > "${RUNNER_TEMP}/abs109-evidence/PACKAGE_METADATA.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'abs109-evidence'
          package=json.loads((p/'PACKAGE_METADATA.json').read_text())
          receipt={'image':os.environ['IMAGE'],'digest':os.environ['DIGEST'],'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'repository':os.environ['GITHUB_REPOSITORY'],'actor':os.environ['GITHUB_ACTOR'],'package_visibility':package.get('visibility'),'associated_repository':(package.get('repository') or {}).get('full_name'),'codex_baked':False,'model_calls':0,'anonymous_pull':'NOT_YET_VERIFIED'}
          (p/'PUBLISH_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          printf 'Published `%s@%s`\n' "${IMAGE}" "${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          printf 'Only this package may be made public. Anonymous verification is a separate required step.\n' >> "${GITHUB_STEP_SUMMARY}"
      - name: Preserve non-sensitive build and release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abs-environment-109-${{ github.sha }}
          path: ${{ runner.temp }}/abs109-evidence
          if-no-files-found: warn
          retention-days: 7

  verify-anonymous:
    if: inputs.operation == 'verify_anonymous' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/abs-env-ghcr-109-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source commit and perform an unauthenticated complete pull
        env:
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          PUBLISHED_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "${REVIEWED_COMMIT}"
          python3 images/abs-module-cache-flags/verify_anonymous_pull.py --digest "${PUBLISHED_DIGEST}"
      - name: Preserve anonymous pull evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abs-anonymous-pull-109-${{ github.sha }}
          path: ${{ runner.temp }}/abs109-anonymous/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve full anonymous pull log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abs-anonymous-log-109-${{ github.sha }}
          path: ${{ runner.temp }}/abs109-anonymous/ANONYMOUS_DOCKER_PULL.log
          if-no-files-found: warn
          retention-days: 7
