name: Publish qualified fixed Igel environment
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        required: true
        type: string
permissions:
  contents: read
  packages: write
env:
  SOURCE: public.ecr.aws/d3j8x8q7/swe-bench-202605@sha256:434ed4187abdb6948dec6434ab4a354d11a19955ebcc706a605ebc6e2470c140
  EXPECTED_CONFIG: sha256:101639dde98c1b250116d94876cf186cbab102f844bbb3a78e38815cee78b389
  TARGET: ghcr.io/codex-radar/dradar-env-igel-persist-feature-schema
jobs:
  publish:
    if: github.actor == 'SecurityMind' && github.sha == inputs.reviewed_commit
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch the exact qualified official image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$SOURCE"
          test "$(docker image inspect --format '{{.Id}}' "$SOURCE")" = "$EXPECTED_CONFIG"
          python3 images/igel-persist-feature-schema/verify_fixed_image.py "$SOURCE"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the registry-copy tool on the CI host
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo --version
      - name: Copy original manifests and blobs with digests preserved
        id: push
        run: |
          set -euo pipefail
          ref="$TARGET:fresh64-001-${GITHUB_SHA}-amd64"
          task_auth_file="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          skopeo copy --all --preserve-digests --dest-authfile "$task_auth_file" \
            --digestfile copy.digest "docker://$SOURCE" "docker://$ref"
          digest=$(tr -d '\r\n' < copy.digest)
          test "$digest" = "${SOURCE##*@}"
          skopeo inspect --raw --authfile "$task_auth_file" "docker://$TARGET@$digest" > copied-manifest.json
          test "sha256:$(sha256sum copied-manifest.json | cut -d ' ' -f 1)" = "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable identity
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker pull --platform linux/amd64 "$TARGET@$DIGEST"
          python3 images/igel-persist-feature-schema/verify_fixed_image.py "$TARGET@$DIGEST"
          cp copied-manifest.json evidence/
          docker image inspect "$TARGET@$DIGEST" > evidence/registry-image.json
          cp images/igel-persist-feature-schema/REAL_LOOP_PUBLIC.json evidence/
          cp images/igel-persist-feature-schema/FIXED_IMAGE_PUBLIC.json evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: igel-fixed-publication
          path: evidence/
  anonymous:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download the complete public image with an empty Docker config
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          chmod 700 "$DOCKER_CONFIG"
          test -z "$(docker image ls --quiet --no-trunc | grep -F "$EXPECTED_CONFIG" || true)"
          test ! -e "$DOCKER_CONFIG/config.json"
          mkdir -p evidence
          docker pull --platform linux/amd64 "$TARGET@$DIGEST" | tee evidence/full-anonymous-pull.log
          test "$(docker image inspect --format '{{.Id}}' "$TARGET@$DIGEST")" = "$EXPECTED_CONFIG"
          python3 images/igel-persist-feature-schema/verify_fixed_image.py "$TARGET@$DIGEST"
          docker image inspect "$TARGET@$DIGEST" > evidence/anonymous-image.json
          test ! -e "$DOCKER_CONFIG/config.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: igel-full-anonymous-pull
          path: evidence/
