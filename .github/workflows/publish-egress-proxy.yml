name: Mirror fixed DeepSWE15 official images unchanged
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Copy fifteen original images, or verify all public anonymous pulls
        required: true
        type: choice
        options: [mirror, anonymous]
      reviewed_commit:
        description: Exact isolated branch commit
        required: true
        type: string
      batch_sha256:
        description: SHA256 of fixed fifteen-row BATCH.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ghcr-environment-publication
  cancel-in-progress: false
env:
  PUBLIC_FILES: images/deepswe15-mirror
jobs:
  mirror:
    if: inputs.phase == 'mirror' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/deepswe15-official-mirror-20261007' && github.actor == 'SecurityMind' && github.sha == inputs.reviewed_commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official registry-copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          skopeo --version
      - name: Copy only the fixed fifteen unchanged official images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED: ${{ inputs.reviewed_commit }}
          BATCH_HASH: ${{ inputs.batch_sha256 }}
        run: |
          set -euo pipefail
          python3 "$PUBLIC_FILES/mirror.py" mirror --root "$PUBLIC_FILES" --out "$RUNNER_TEMP/deepswe15-copy" --reviewed "$REVIEWED" --batch-hash "$BATCH_HASH"
      - name: Preserve new copy receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepswe15-official-copy
          path: |
            ${{ runner.temp }}/deepswe15-copy/*/*.json
            ${{ runner.temp }}/deepswe15-copy/*/*.log
            ${{ runner.temp }}/deepswe15-copy/BATCH_COPY_RECEIPT.json
          retention-days: 30
          if-no-files-found: warn
  anonymous:
    if: inputs.phase == 'anonymous' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/deepswe15-official-mirror-20261007' && github.actor == 'SecurityMind' && github.sha == inputs.reviewed_commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official registry-read tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Verify Public metadata and complete anonymous pulls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED: ${{ inputs.reviewed_commit }}
          BATCH_HASH: ${{ inputs.batch_sha256 }}
        run: |
          set -euo pipefail
          python3 "$PUBLIC_FILES/mirror.py" anonymous --root "$PUBLIC_FILES" --out "$RUNNER_TEMP/deepswe15-anonymous" --reviewed "$REVIEWED" --batch-hash "$BATCH_HASH"
      - name: Stage only public receipts outside Docker data directories
        if: always()
        run: |
          python3 "$PUBLIC_FILES/stage_receipts.py" "$RUNNER_TEMP/deepswe15-anonymous" "$RUNNER_TEMP/deepswe15-anonymous-public"
      - name: Preserve new anonymous receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepswe15-full-anonymous-pull
          path: ${{ runner.temp }}/deepswe15-anonymous-public/
          retention-days: 30
          if-no-files-found: warn
