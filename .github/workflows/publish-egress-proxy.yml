name: Publish egress proxy image

on:
  push:
    branches: [main]
    paths:
      - docker/egress-proxy/**
      - .github/workflows/publish-egress-proxy.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/codex-radar/dradar-egress-proxy

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the native image for vulnerability scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/egress-proxy
          load: true
          platforms: linux/amd64
          provenance: false
          push: false
          sbom: false
          tags: dradar-egress-proxy:scan

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Scan fixable high and critical vulnerabilities
        run: >-
          trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1
          dradar-egress-proxy:scan

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=v1
            type=sha,format=long

      - name: Build and publish the multi-architecture image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/egress-proxy
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Sign the immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Volunteers should not need a GHCR login or a separately configured
      # Docker-daemon proxy. Export both platform images as ordinary public
      # GitHub release assets; the CLI downloads and verifies the matching
      # archive over its normal HTTPS/proxy path, then uses `docker load`.
      - name: Export portable image archives
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            source_ref="${IMAGE}@${DIGEST}"
            portable_ref="${IMAGE}:release-${GITHUB_SHA}-${arch}"
            docker pull --platform "linux/${arch}" "${source_ref}"
            docker tag "${source_ref}" "${portable_ref}"
            docker image inspect --format '{{.Id}}' "${portable_ref}" \
              > "dist/dradar-egress-proxy-linux-${arch}.image-id"
            docker save "${portable_ref}" \
              | gzip -9 > "dist/dradar-egress-proxy-linux-${arch}.tar.gz"
            # Removing the portable tag also removes the digest-only reference
            # when both are the last references to the same platform image.
            docker image rm "${portable_ref}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Publish anonymous release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          release_tag="egress-proxy-${GITHUB_SHA}"
          gh release create "${release_tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "DRadar egress proxy ${GITHUB_SHA}" \
            --notes "Signed multi-architecture Pier egress image. GHCR manifest: ${DIGEST}" \
            --prerelease \
            --latest=false
