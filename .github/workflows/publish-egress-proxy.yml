name: Copy original qualified Kombu 002 environment

# Review-only candidate for this independent branch's registered workflow path.
# Manager must first arrange the user-required shared publication window.
on:
  workflow_dispatch:
    inputs:
      phase:
        required: true
        type: choice
        options: [publish, anonymous]
      reviewed_commit:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-dradar-env-kombu-virtual-queue-dead-lettering
  cancel-in-progress: false

env:
  ROOT: images/kombu-virtual-queue-dead-lettering
  REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}

jobs:
  publish:
    if: inputs.phase == 'publish' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/kombu-env-ghcr-002-20261007' && github.actor == 'SecurityMind'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the registry copy tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Copy the untouched immutable official source to this one package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "$ROOT/scripts/mirror.sh"
      - name: Read the actual package Public visibility and repository association
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "$ROOT/scripts/package_metadata.py" --evidence "$RUNNER_TEMP/kombu002-minimal-publication"
      - name: Keep publication identity and metadata evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kombu002-minimal-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/kombu002-minimal-publication
          if-no-files-found: warn
          retention-days: 14

  anonymous:
    if: inputs.phase == 'anonymous' && github.repository == 'codex-radar/dradar' && github.ref == 'refs/heads/codex/kombu-env-ghcr-002-20261007' && github.actor == 'SecurityMind'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact reviewed candidate and prior real qualification
        run: python3 "$ROOT/scripts/gate.py" --root "$ROOT" --evidence "$RUNNER_TEMP/kombu002-minimal-anonymous"
      - name: Read actual Public package and repository association
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "$ROOT/scripts/package_metadata.py" --evidence "$RUNNER_TEMP/kombu002-minimal-anonymous"
      - name: Complete credential-free anonymous pull in an empty Docker config
        run: python3 "$ROOT/scripts/anonymous_pull.py" --root "$ROOT" --evidence "$RUNNER_TEMP/kombu002-minimal-anonymous"
      - name: Keep full anonymous pull and identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kombu002-minimal-anonymous-${{ github.run_id }}
          path: ${{ runner.temp }}/kombu002-minimal-anonymous
          if-no-files-found: warn
          retention-days: 14
