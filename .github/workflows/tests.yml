name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install ".[dev,host-codex]"
      - name: Run root test suite with an isolated home
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tempfile

          # Set before collection; tests/conftest.py pins the root src/ tree.
          with tempfile.TemporaryDirectory(prefix="dradar-tests-") as home:
              result = subprocess.run(
                  [sys.executable, "-m", "pytest", "tests/"],
                  env={**os.environ, "DRADAR_HOME": home},
              )
          raise SystemExit(result.returncode)
