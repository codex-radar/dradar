name: Four PR native integration
on:
  push:
    branches: [codex/0088-pr-integration-ci]
    paths: ['.github/workflows/integration-native.yml']
permissions:
  contents: read
jobs:
  regression:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: 0.9.7
          enable-cache: false
      - name: Locked dependencies
        shell: bash
        run: |
          uv venv --python 3.12 .qa-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            QA_PYTHON="$GITHUB_WORKSPACE/.qa-venv/Scripts/python.exe"
          else
            QA_PYTHON="$GITHUB_WORKSPACE/.qa-venv/bin/python"
          fi
          echo "QA_PYTHON=$QA_PYTHON" >> "$GITHUB_ENV"
          uv pip install --python "$QA_PYTHON" --require-hashes -r tests/integration-ci/requirements.lock
      - name: Fixed candidate controlled regressions
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code e7fb3a46919bd4ae4cfe0c4f1a25bc5d8329c110 HEAD -- src tests/test_pr_integration_boundaries.py tests/test_antigravity_subscription.py tests/test_runner_tools.py tests/test_api_client.py tests/test_egress.py tests/test_machine.py tests/test_image_cache.py pyproject.toml .gitattributes
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy
          "$QA_PYTHON" --version
          "$QA_PYTHON" -m pytest tests/test_pr_integration_boundaries.py tests/test_antigravity_subscription.py tests/test_runner_tools.py tests/test_api_client.py tests/test_egress.py tests/test_machine.py tests/test_image_cache.py -q --tb=short
