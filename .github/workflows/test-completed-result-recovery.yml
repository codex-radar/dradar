name: Completed result recovery
on:
  pull_request:
    paths:
      - 'src/dradar/completed_result_recovery.py'
      - 'src/dradar/cleanup_recovery.py'
      - 'src/dradar/recover_upload.py'
      - 'src/dradar/pending_upload.py'
      - 'tests/test_completed_result_recovery.py'
      - 'tests/test_cleanup_recovery.py'
      - 'tests/test_recover_upload.py'
      - 'tests/test_pending_upload.py'
      - '.github/workflows/test-completed-result-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pytest
      - name: Verify completed result and upload recovery
        env:
          PYTHONUTF8: '1'
          DRADAR_HOME: ${{ runner.temp }}/completed-result-fixture-home
        run: >-
          python -m pytest -q tests/test_completed_result_recovery.py
          tests/test_cleanup_recovery.py tests/test_recover_upload.py
          tests/test_pending_upload.py
